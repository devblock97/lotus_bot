name: lotus_ai
description: "An offline-first AI chat application supporting local and remote LLMs with VIPER and Flutter BLoC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # Networking & HTTP
  dio: ^5.8.0+1

  # Local Offline Database (SQLite)
  drift: ^2.24.0
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Markdown & Highlighting UI
  flutter_markdown: ^0.7.6+1
  flutter_highlighter: ^0.1.1
  markdown: ^7.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
